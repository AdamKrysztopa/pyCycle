[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]

[project]
name = "om-pycycle"
dynamic = ["version"]
description = "pyCycle -- Thermodynamic Cycle modeling library"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "NASA Glenn Research Center"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "openmdao>=3.10.0",
    "numpy>=1.20.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
test = [
    "testflo>=1.3.6",
    "parameterized",
    "pytest>=7.0",
    "pytest-cov",
]
dev = [
    "testflo>=1.3.6",
    "parameterized",
    "pytest>=7.0",
    "pytest-cov",
    "sphinx",
    "sphinx-rtd-theme",
    "black",
    "flake8",
    "mypy",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme",
]
all = [
    "testflo>=1.3.6",
    "parameterized",
    "pytest>=7.0",
    "pytest-cov",
    "sphinx>=4.0",
    "sphinx-rtd-theme",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/OpenMDAO/pyCycle"
Documentation = "https://github.com/OpenMDAO/pyCycle"
Source = "https://github.com/OpenMDAO/pyCycle"
Tracker = "https://github.com/OpenMDAO/pyCycle/issues"

[tool.setuptools]
packages = [
    "pycycle",
    "pycycle.elements",
    "pycycle.elements.test",
    "pycycle.maps",
    "pycycle.maps.test",
    "pycycle.thermo",
    "pycycle.thermo.cea",
    "pycycle.thermo.cea.test",
    "pycycle.thermo.cea.thermo_data",
    "pycycle.thermo.tabular",
    "pycycle.thermo.tabular.test",
    "pycycle.thermo.test",
    "pycycle.tests",
]

[tool.setuptools.package-data]
"pycycle.elements.test" = ["reg_data/*.csv"]
"pycycle.thermo.test" = ["*.csv"]
"pycycle.thermo.tabular" = ["*.pkl"]

[tool.setuptools_scm]
write_to = "pycycle/_version.py"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["pycycle", "example_cycles"]
python_files = ["test_*.py", "benchmark_*.py"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
